<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UrbanMed · Hospital Operations Platform</title>
<meta property="og:type" content="website">
<meta property="og:title" content="UrbanMed · Hospital Operations Platform">
<meta property="og:description" content="Clear operations, calm leadership. Live bed occupancy, ER wait times, OR utilization and more at a glance.">
<meta property="og:image" content="urbanmed-og.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="UrbanMed · Hospital Operations Platform">
<meta name="twitter:description" content="Clear operations, calm leadership. Live bed occupancy, ER wait times, OR utilization and more at a glance.">
<meta name="twitter:image" content="urbanmed-og.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f1;
  --surface:#ffffff;
  --inset:color-mix(in oklab,var(--fg) 4%,var(--surface));
  --fg:#191a1f;
  --muted:#5e5a52;
  --border:#e9e2d5;
  --accent:#33409c;
  --accent-strong:color-mix(in oklab,var(--accent) 84%,#06061a);
  --accent-dark:color-mix(in oklab,var(--accent) 78%,#000000);
  --accent-tint:color-mix(in oklab,var(--accent) 8%,var(--bg));
  --accent-border:color-mix(in oklab,var(--accent) 30%,var(--border));
  --success:#3ecf9e;
  --success-strong:color-mix(in oklab,var(--success) 44%,#073126);
  --success-tint:color-mix(in oklab,var(--success) 12%,var(--bg));
  --warn:#c27612;
  --warn-strong:color-mix(in oklab,var(--warn) 66%,#3a2400);
  --warn-tint:color-mix(in oklab,var(--warn) 10%,var(--bg));
  --danger:#d33a2b;
  --danger-strong:color-mix(in oklab,var(--danger) 84%,#380a05);
  --danger-tint:color-mix(in oklab,var(--danger) 9%,var(--bg));
  --info:#0e9d8c;
  --info-strong:color-mix(in oklab,var(--info) 62%,#052f2a);
  --info-tint:color-mix(in oklab,var(--info) 9%,var(--bg));
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Helvetica Neue,Arial,sans-serif;
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --topbar-h:64px;
  --nav-w:244px;
  --nav-w-collapsed:64px;
  --radius:12px;
  --shadow-1:0 1px 2px rgba(25,26,31,.05);
  --shadow-2:0 10px 30px -12px rgba(25,26,31,.18);
  --shadow-3:0 30px 70px -20px rgba(25,26,31,.28);
}
[data-theme="dark"]{
  --bg:#15161c;
  --surface:#1d1f27;
  --inset:color-mix(in oklab,var(--fg) 7%,var(--surface));
  --fg:#f5f3ec;
  --muted:#b5b0a3;
  --border:rgba(255,255,255,.1);
  --accent:#aab4f0;
  --accent-strong:#c3cbf5;
  --accent-dark:#8f9ae8;
  --accent-tint:color-mix(in oklab,var(--accent) 16%,var(--surface));
  --accent-border:color-mix(in oklab,var(--accent) 34%,rgba(255,255,255,.1));
  --success:#4dd6a5;
  --success-strong:#7fe6c0;
  --success-tint:color-mix(in oklab,var(--success) 18%,var(--surface));
  --warn:#e5a64f;
  --warn-strong:#eebc74;
  --warn-tint:color-mix(in oklab,var(--warn) 18%,var(--surface));
  --danger:#ff6b5e;
  --danger-strong:#ff8a80;
  --danger-tint:color-mix(in oklab,var(--danger) 18%,var(--surface));
  --info:#38c4b2;
  --info-strong:#63d4c5;
  --info-tint:color-mix(in oklab,var(--info) 18%,var(--surface));
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 10px 30px -12px rgba(0,0,0,.5);
  --shadow-3:0 30px 70px -20px rgba(0,0,0,.6);
}
[data-theme="dark"] .btn--primary{background:color-mix(in oklab,var(--accent) 58%,#06061a);color:#ffffff}
[data-theme="dark"] .btn--primary:hover{background:color-mix(in oklab,var(--accent) 72%,#06061a)}
[data-theme="dark"] .btn--danger{background:color-mix(in oklab,var(--danger) 58%,#2a0505);color:#ffffff}
[data-theme="dark"] .btn--danger:hover{background:color-mix(in oklab,var(--danger) 75%,#2a0505)}
[data-theme="dark"] .iconbtn__badge{background:color-mix(in oklab,var(--danger) 58%,#2a0505);color:#ffffff}
[data-theme="dark"] .navitem__badge.is-hot{background:color-mix(in oklab,var(--danger) 58%,#2a0505);color:#ffffff}
[data-theme="dark"] .brand__mark{background:color-mix(in oklab,var(--accent) 72%,#06061a);color:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  font-size:14px;line-height:1.55;
  color:var(--fg);background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;flex:none;display:block}
.ic--sm{width:15px;height:15px}

.app{min-height:100vh;display:flex;flex-direction:column}

.topbar{
  height:var(--topbar-h);
  background:color-mix(in oklab,var(--bg) 86%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
  padding:0 22px;
  position:sticky;top:0;z-index:30;
}
.brand{display:flex;align-items:center;gap:11px;flex:none;width:calc(var(--nav-w) - 40px)}
.brand__mark{
  width:32px;height:32px;border-radius:9px;
  background:var(--accent);color:#ffffff;
  display:grid;place-items:center;
  box-shadow:0 1px 2px color-mix(in oklab,var(--accent) 30%,transparent);
}
.brand__name{display:block;font-size:15px;font-weight:700;letter-spacing:-0.01em;line-height:1.1;white-space:nowrap}
.brand__name em{font-style:normal;color:var(--accent)}
.brand__tag{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;line-height:1.2;white-space:nowrap;margin-top:1px}
.topbar__search{
  flex:1;max-width:520px;height:40px;
  display:flex;align-items:center;gap:10px;
  padding:0 14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:999px;
  color:var(--muted);font-size:13.5px;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.topbar__search:hover{border-color:color-mix(in oklab,var(--border) 55%,var(--fg))}
.topbar__search:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);color:var(--fg)}
.kbd{
  margin-left:auto;font-size:11px;font-weight:600;
  color:var(--muted);background:var(--bg);
  border:1px solid var(--border);border-radius:6px;
  padding:2px 7px;letter-spacing:.02em;white-space:nowrap;
}
.topbar__right{margin-left:auto;display:flex;align-items:center;gap:6px}

.live{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:600;color:var(--info-strong);
  background:var(--info-tint);
  padding:6px 13px;border-radius:999px;
  margin-right:6px;white-space:nowrap;
}
.live__dot{width:7px;height:7px;border-radius:50%;background:var(--info);position:relative}
.live__dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--info);opacity:0;animation:ping 2.4s ease-out infinite;will-change:transform}
@keyframes ping{0%{transform:scale(.5);opacity:.7}80%,100%{transform:scale(1.4);opacity:0}}
.live.is-off{color:var(--danger-strong);background:var(--danger-tint)}
.live.is-off .live__dot{background:var(--danger)}
.live.is-off .live__dot::after{border-color:var(--danger);animation:none}

.iconbtn{
  position:relative;width:40px;height:40px;border-radius:10px;
  display:grid;place-items:center;color:var(--muted);
  transition:background .15s,color .15s;
}
.iconbtn:hover{background:var(--inset);color:var(--fg)}
.iconbtn:active{transform:translateY(1px)}
.iconbtn__badge{
  position:absolute;top:5px;right:5px;
  min-width:17px;height:17px;padding:0 5px;
  border-radius:999px;background:var(--danger);color:#ffffff;
  font-size:10px;font-weight:700;display:grid;place-items:center;
  border:2px solid var(--bg);transition:transform .2s;
}
.iconbtn__badge.bump{animation:bump .4s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.theme-toggle{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.theme-toggle:hover{background:var(--inset);color:var(--fg)}
.theme-toggle .ic.swap{animation:iconSwap .22s cubic-bezier(.2,0,0,1)}
@keyframes iconSwap{0%{transform:rotate(-90deg) scale(.6);opacity:0}100%{transform:rotate(0) scale(1);opacity:1}}

.shell{display:flex;flex:1;min-height:0}

.sidebar{
  width:var(--nav-w);background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:width .22s cubic-bezier(.2,0,0,1);overflow:hidden;
}
.sidebar.collapsed{width:var(--nav-w-collapsed)}
.sidebar__nav{flex:1;overflow-y:auto;padding:14px 14px 8px}
.sidebar__group{margin-bottom:18px}
.sidebar__label{
  font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;color:var(--muted);
  padding:0 12px;margin-bottom:7px;white-space:nowrap;
}
.sidebar.collapsed .sidebar__label{opacity:0;height:0;margin:0}
.navitem{
  width:100%;display:flex;align-items:center;gap:12px;
  height:40px;padding:0 12px;border-radius:10px;
  color:var(--fg);font-size:13.5px;font-weight:500;
  margin-bottom:2px;position:relative;white-space:nowrap;
  transition:background .13s,color .13s;
}
.navitem:hover{background:var(--inset)}
.navitem.is-active{background:var(--accent-tint);color:var(--accent);font-weight:600}
.navitem__label{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis}
.sidebar.collapsed .navitem__label,.sidebar.collapsed .navitem__badge{display:none}
.sidebar.collapsed .navitem{justify-content:center;padding:0}
.navitem__badge{
  font-size:11px;font-weight:600;min-width:22px;height:20px;padding:0 7px;
  border-radius:999px;background:var(--inset);color:var(--muted);
  display:grid;place-items:center;transition:background .2s;
}
.navitem.is-active .navitem__badge{background:var(--surface);color:var(--accent)}
.navitem__badge.is-hot{background:var(--danger);color:#ffffff}
.navitem__badge.bump{animation:bump .4s}
.sidebar__foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:10px}
.sidebar__collapse{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .15s,color .15s}
.sidebar__collapse:hover{background:var(--inset);color:var(--fg)}
.sidebar__hint{font-size:11px;color:var(--muted);white-space:nowrap}
.sidebar.collapsed .sidebar__hint{display:none}
.sidebar.collapsed .sidebar__foot{justify-content:center}

.main{flex:1;min-width:0;overflow-y:auto}
.page{padding:34px 36px 56px;max-width:1280px;margin:0 auto}
.page.enter>*{animation:pageIn .2s cubic-bezier(.2,0,0,1) both}
.page.enter>*:nth-child(2){animation-delay:.05s}
.page.enter>*:nth-child(3){animation-delay:.1s}
.page.enter>*:nth-child(4){animation-delay:.15s}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.pagehead__title{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,3.1vw,40px);letter-spacing:-0.01em;line-height:1.08;color:var(--fg)}
.pagehead__sub{font-size:13.5px;color:var(--muted);margin-top:8px;max-width:60ch}
.pagehead__meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;align-self:center}
.kicker{
  font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;
}
.kicker::before{content:"";width:20px;height:1px;background:var(--accent);opacity:.5}
.datechip{
  font-size:12px;font-weight:600;color:var(--muted);
  background:var(--surface);border:1px solid var(--border);
  padding:8px 13px;border-radius:999px;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
}

.btn{
  height:42px;padding:0 18px;border-radius:999px;
  font-size:14px;font-weight:600;letter-spacing:.01em;
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid transparent;
  transition:background .15s,transform .1s,box-shadow .15s,border-color .15s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px) scale(.99)}
.btn--primary{background:var(--accent);color:#ffffff}
.btn--primary:hover{background:var(--accent-strong)}
.btn--ghost{background:var(--surface);border-color:var(--border);color:var(--fg)}
.btn--ghost:hover{background:var(--inset)}
.btn--danger{background:var(--danger);color:#ffffff}
.btn--danger:hover{background:var(--danger-strong)}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn:focus-visible{box-shadow:0 0 0 3px var(--accent-tint)}
.rowact:active{transform:translateY(1px)}
.panel__link:active,.alertrow__act:active,.dropdown__act:active{opacity:.65}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:20px 22px;position:relative;
  transition:transform .15s,box-shadow .15s;
}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.stat__label{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.stat__icon{color:var(--muted)}
.stat__value{font-family:var(--font-display);font-weight:400;font-size:34px;letter-spacing:-0.01em;line-height:1.05;margin-top:10px;font-variant-numeric:tabular-nums}
.stat__sub{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trend{font-weight:600;display:inline-flex;align-items:center;gap:4px}
.trend--up{color:var(--success-strong)}
.trend--down{color:var(--danger-strong)}
.stat__urgent{color:var(--danger-strong);font-weight:600}

.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.deptgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.deptmeta{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;border-top:1px solid var(--border);padding-top:16px;margin-top:6px}
.deptmeta__cell{display:flex;flex-direction:column;gap:3px}
.dm__label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dm__value{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.panel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:22px;
}
.panel__head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.panel__title{font-size:15.5px;font-weight:600;letter-spacing:-0.01em;display:flex;align-items:center;gap:9px}
.panel__title .ic{color:var(--muted)}
.panel__link{font-size:13px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:5px}
.panel__link:hover{text-decoration:underline}

.deptrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border)}
.deptrow:last-child{border-bottom:0}
.deptrow__name{flex:1;font-size:14px;font-weight:500;display:flex;align-items:center;gap:9px}
.deptrow__wait{font-size:13px;color:var(--muted);white-space:nowrap}
.deptrow__bar{width:120px;height:7px;border-radius:4px;background:var(--inset);overflow:hidden;flex:none}
.deptrow__fill{height:100%;border-radius:4px;transform-origin:left center;animation:fillIn .5s cubic-bezier(.2,0,0,1) both}
.tone-danger{--tone:var(--danger-strong);--fill:var(--danger)}
.tone-warn{--tone:var(--warn-strong);--fill:var(--warn)}
.tone-ok{--tone:var(--success-strong);--fill:var(--success)}
.tone-accent{--tone:var(--accent);--fill:var(--accent)}
.tone-info{--tone:var(--info-strong);--fill:var(--info)}
.deptrow__fill{background:var(--fill)}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:600;letter-spacing:.01em;
  padding:4px 10px;border-radius:999px;white-space:nowrap;
}
.badge--danger{background:var(--danger-tint);color:var(--danger-strong)}
.badge--warn{background:var(--warn-tint);color:var(--warn-strong)}
.badge--ok{background:var(--success-tint);color:var(--success-strong)}
.badge--info{background:var(--info-tint);color:var(--info-strong)}
.badge--neutral{background:var(--inset);color:var(--muted)}
.badge--accent{background:var(--accent-tint);color:var(--accent)}

.alertrow{display:flex;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border);align-items:flex-start}
.alertrow:last-child{border-bottom:0}
.alertrow__icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;margin-top:1px}
.alertrow--danger .alertrow__icon{background:var(--danger-tint);color:var(--danger-strong)}
.alertrow--warn .alertrow__icon{background:var(--warn-tint);color:var(--warn-strong)}
.alertrow--ok .alertrow__icon{background:var(--success-tint);color:var(--success-strong)}
.alertrow__body{flex:1;min-width:0}
.alertrow__text{font-size:13.5px;line-height:1.5}
.alertrow__text b{font-weight:600}
.alertrow__meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.alertrow__act{font-size:12.5px;font-weight:600;color:var(--accent);margin-top:4px;display:inline-flex;align-items:center;gap:4px}
.alertrow__act:hover{text-decoration:underline}

.bedsgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.reportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:1120px){.reportgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:720px){.reportgrid{grid-template-columns:1fr}}
.report{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s}
.report:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.report__top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.report__icon{width:34px;height:34px;border-radius:10px;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center}
.report__title{font-size:15.5px;font-weight:600;letter-spacing:-0.01em;margin-top:6px}
.report__desc{font-size:12.5px;color:var(--muted);line-height:1.55}
.report__stat{font-family:var(--font-display);font-weight:400;font-size:30px;letter-spacing:-0.01em;line-height:1.05;margin-top:6px;display:flex;flex-direction:column;gap:3px}
.report__sub{font-family:var(--font);font-size:12px;color:var(--muted);font-weight:400}
.report__act{margin-top:10px;border-top:1px solid var(--border);padding-top:12px}
.btn--sm{height:34px;padding:0 12px;font-size:12.5px}
.bedprog{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.bedprog__name{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.bedprog__val{color:var(--muted);font-weight:500}
.bedprog__track{height:8px;border-radius:4px;background:var(--inset);margin-top:11px;overflow:hidden}
.bedprog__fill{height:100%;border-radius:4px;background:var(--fill);transform-origin:left center;animation:fillIn .55s cubic-bezier(.2,0,0,1) both}
@keyframes fillIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bedprog__sub{font-size:11.5px;color:var(--muted);margin-top:7px}
.bedprog.tone-danger{--fill:var(--danger)}
.bedprog.tone-warn{--fill:var(--warn)}
.bedprog.tone-ok{--fill:var(--success)}

.tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{
  text-align:left;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);padding:13px 16px;border-bottom:1px solid var(--border);
  background:var(--inset);white-space:nowrap;
}
.table td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr{transition:background .12s}
.table tbody tr:hover{background:var(--inset)}
.cell-name{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px}
.cell-name__sub{font-size:11.5px;color:var(--muted);font-weight:400}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--inset);color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.avatar--danger{background:var(--danger-tint);color:var(--danger-strong)}
.avatar--ok{background:var(--success-tint);color:var(--success-strong)}
.rowact{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);padding:7px 10px;border-radius:8px}
.rowact:hover{background:var(--accent-tint)}
.rowact.is-danger{color:var(--danger-strong)}
.rowact.is-danger:hover{background:var(--danger-tint)}
.pri{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.pri__dot{width:7px;height:7px;border-radius:50%}
.pri--critical{color:var(--danger-strong)}
.pri--critical .pri__dot{background:var(--danger);box-shadow:0 0 0 3px var(--danger-tint)}
.pri--high{color:var(--warn-strong)}
.pri--high .pri__dot{background:var(--warn)}
.pri--normal{color:var(--fg)}
.pri--normal .pri__dot{background:var(--muted)}
.pri--low{color:var(--muted)}
.pri--low .pri__dot{background:var(--border)}
.wait{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.wait.is-long{color:var(--danger-strong);font-weight:600}

.wards{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.wardchip{
  height:38px;padding:0 16px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);
  font-size:13px;font-weight:600;color:var(--fg);
  display:inline-flex;align-items:center;gap:8px;
  transition:border-color .15s,background .15s,color .15s;
}
.wardchip:hover{border-color:var(--accent-border)}
.wardchip.is-active{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.wardchip__count{font-size:11px;font-weight:600;color:var(--muted)}
.wardchip.is-active .wardchip__count{color:inherit;opacity:.85}
.bedmap{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.bed{
  height:62px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:13px;font-weight:600;
  transition:transform .12s,box-shadow .12s,border-color .12s;
}
.bed:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.bed__tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.bed--available{border-color:var(--success);background:var(--success-tint);color:var(--success-strong)}
.bed--available .bed__tag{color:var(--success-strong)}
.bed--occupied{background:var(--inset);color:var(--muted)}
.bed--occupied .bed__tag{color:var(--muted)}
.bed--reserved{border-color:var(--warn);background:var(--warn-tint);color:var(--warn-strong)}
.bed--reserved .bed__tag{color:var(--warn-strong)}
.bed--cleaning{border-color:var(--info);background:var(--info-tint);color:var(--info-strong)}
.bed--cleaning .bed__tag{color:var(--info-strong)}
.bed--maintenance{background:repeating-linear-gradient(45deg,var(--inset) 0 6px,var(--surface) 6px 12px);color:var(--muted)}
.bed--maintenance .bed__tag{color:var(--muted)}
@keyframes bedIn{from{opacity:0;transform:translateY(4px) scale(.97)}to{opacity:1;transform:none}}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px;font-size:12px;color:var(--muted)}
.legend__item{display:flex;align-items:center;gap:7px}
.legend__swatch{width:12px;height:12px;border-radius:4px;border:1px solid var(--border)}

.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in oklab,var(--fg) 22%,transparent);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .15s}
.overlay.is-open{opacity:1;pointer-events:auto}
.palette{
  position:fixed;top:84px;left:50%;transform:translateX(-50%) translateY(-8px);
  width:min(600px,calc(100vw - 32px));
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--shadow-3);
  z-index:60;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s cubic-bezier(.2,0,0,1);will-change:transform,opacity;
  overflow:hidden;
}
.palette.is-open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.palette__input{width:100%;border:0;outline:none;background:var(--surface);font:inherit;font-size:15px;color:var(--fg);padding:18px 20px 18px 52px}
.palette__search{position:absolute;left:20px;top:21px;color:var(--muted)}
.palette__results{max-height:340px;overflow-y:auto;border-top:1px solid var(--border);padding:8px}
.palette__cat{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 12px 6px}
.palette__item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;text-align:left}
.palette__item:hover,.palette__item.is-sel{background:var(--accent-tint)}
.palette__item.is-sel .palette__label{color:var(--accent)}
.palette__item__icon{width:32px;height:32px;border-radius:9px;background:var(--inset);display:grid;place-items:center;color:var(--muted);flex:none}
.palette__label{font-size:14px;font-weight:600;color:var(--fg)}
.palette__sub{font-size:12px;color:var(--muted)}
.palette__foot{display:flex;gap:16px;align-items:center;padding:10px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);background:var(--inset)}
.palette__empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:13.5px}

.dropdown{
  position:fixed;z-index:55;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow-3);
  width:340px;overflow:hidden;
  opacity:0;pointer-events:none;transform:translateY(-6px);
  transition:opacity .16s,transform .16s cubic-bezier(.2,0,0,1);will-change:transform,opacity;
}
.dropdown.is-open{opacity:1;pointer-events:auto;transform:translateY(0)}
.dropdown--narrow{width:252px}
.dropdown__head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.dropdown__title{font-size:14px;font-weight:600}
.dropdown__act{font-size:12px;font-weight:600;color:var(--accent)}
.dropdown__act:hover{text-decoration:underline}
.dropdown__body{max-height:400px;overflow-y:auto}
.notif{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.notif:last-child{border-bottom:0}
.notif:hover{background:var(--inset)}
.notif__icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;margin-top:1px}
.notif__text{font-size:13px;line-height:1.45}
.notif__text b{font-weight:600}
.notif__time{font-size:11px;color:var(--muted);margin-top:2px}
.menurow{width:100%;display:flex;align-items:center;gap:11px;padding:10px 14px;font-size:13.5px;font-weight:500;color:var(--fg);transition:background .12s}
.menurow:hover{background:var(--inset)}
.menurow .ic{color:var(--muted)}
.menurow.is-role{justify-content:space-between}
.menurow__check{color:var(--accent)}
.roleline{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--inset)}
.roleline__name{font-size:14px;font-weight:600}
.roleline__role{font-size:12px;color:var(--muted);margin-top:1px}
.userbox{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:999px;height:46px;transition:background .15s}
.userbox:hover{background:var(--inset)}
.userbox__name{font-size:13px;font-weight:600;line-height:1.2;text-align:left}
.userbox__role{font-size:11px;color:var(--muted);line-height:1.2;text-align:left}
.menu__sep{height:1px;background:var(--border);margin:6px 0}

.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);
  background:var(--surface);border-left:1px solid var(--border);
  z-index:52;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,0,0,1);will-change:transform;
  display:flex;flex-direction:column;
}
.drawer.is-open{transform:translateX(0)}
.drawer__head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border)}
.drawer__title{font-size:16px;font-weight:600;letter-spacing:-0.01em}
.drawer__body{padding:22px;overflow-y:auto;flex:1}
.drawer__field{margin-bottom:18px}
.drawer__label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.drawer__value{font-size:15px;font-weight:600}
.drawer__row{display:flex;justify-content:space-between;gap:12px}
.drawer__actions{display:flex;flex-direction:column;gap:9px;padding:18px 22px;border-top:1px solid var(--border)}

.modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:20px}
.modal.is-open{display:grid}
.modal__card{
  width:min(440px,100%);
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow-3);padding:26px;animation:modalIn .2s cubic-bezier(.2,0,0,1);will-change:transform,opacity;
}
@keyframes modalIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal__title{font-size:17px;font-weight:600;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px}
.modal__title .ic{color:var(--warn-strong)}
.modal__text{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.55}
.modal__detail{background:var(--inset);border-radius:12px;padding:16px 18px;margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal__detail .drawer__label{margin-bottom:2px}
.modal__detail .drawer__value{font-size:14px}
.modal__actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

.toasts{position:fixed;bottom:24px;right:24px;z-index:80;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);border-radius:999px;
  padding:11px 18px;box-shadow:var(--shadow-2);
  font-size:13.5px;font-weight:500;
  animation:toastIn .2s ease-out;max-width:340px;will-change:transform,opacity;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast.is-out{opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
.toast__icon{flex:none}
.toast--success .toast__icon{color:var(--success-strong)}
.toast--warn .toast__icon{color:var(--warn-strong)}
.toast--info .toast__icon{color:var(--info-strong)}

.bottomnav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--border);
  height:62px;padding-bottom:env(safe-area-inset-bottom);
}
.bottomnav__item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600;height:100%;transition:color .15s}
.bottomnav__item.is-active{color:var(--accent)}

.empty{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:44px 24px;text-align:center}
.empty__icon{width:46px;height:46px;border-radius:12px;background:var(--inset);color:var(--muted);display:grid;place-items:center;margin:0 auto 16px}
.empty__title{font-size:16px;font-weight:600}
.empty__text{font-size:13.5px;color:var(--muted);margin:6px auto 20px;max-width:400px}
.notif-screen-sev{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.notif-screen-sev__dot{width:8px;height:8px;border-radius:50%}

.topbar__search-mobile{display:none;width:40px;height:40px;border-radius:10px;place-items:center;color:var(--muted);background:var(--surface)}

/* ---- Pharmacy Intelligence ---- */
.ph-chip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--fg);transition:border-color .15s,background .15s}
.ph-chip:hover{border-color:var(--accent-border)}
.ph-chip.is-active{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ph-chip__count{font-size:11px;font-weight:600;color:var(--muted)}
.ph-chip.is-active .ph-chip__count{color:inherit;opacity:.85}
.ph-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.ph-prog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;margin:11px 0}
.ph-prog__label{color:var(--muted);font-weight:500}
.ph-prog__val{font-weight:600;font-variant-numeric:tabular-nums}
.ph-track{height:7px;border-radius:4px;background:var(--inset);overflow:hidden}
.ph-track__fill{height:100%;border-radius:4px;transform-origin:left center;animation:fillIn .5s cubic-bezier(.2,0,0,1) both}
.ph-track__fill.tone-ok{background:var(--success)}
.ph-track__fill.tone-warn{background:var(--warn)}
.ph-track__fill.tone-danger{background:var(--danger)}
.ph-track__fill.tone-accent{background:var(--accent)}
.ph-hero{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
.ph-hero__val{font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:-0.01em;line-height:1.1;margin-top:7px;font-variant-numeric:tabular-nums}
.ph-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:20px}
.ph-tab{height:38px;padding:0 15px;border-radius:10px 10px 0 0;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s,background .15s}
.ph-tab:hover{color:var(--fg);background:var(--inset)}
.ph-tab.is-active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-tint)}
.ph-chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding:0 2px}
.ph-chart__col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;min-width:0}
.ph-chart__val{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ph-chart__bar{width:100%;max-width:38px;border-radius:5px 5px 0 0;transform-origin:bottom center;animation:chartUp .45s cubic-bezier(.2,0,0,1) both;min-height:2px}
.ph-chart__label{font-size:11px;font-weight:600;color:var(--muted)}
.ph-chart__bar.tone-ok{background:var(--success)}
.ph-chart__bar.tone-warn{background:var(--warn)}
.ph-chart__bar.tone-danger{background:var(--danger)}
.ph-chart__bar.tone-accent{background:var(--accent)}
@keyframes chartUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.radar{display:flex;flex-direction:column;align-items:center;gap:14px}
.radar svg{width:100%;max-width:520px;height:auto;display:block}
.radar-axis{font-size:11.5px;font-weight:600;fill:var(--muted)}
.radar-poly{transition:opacity .25s ease,stroke-width .25s ease}
.radar-poly:hover{opacity:.9;stroke-width:2.6}
.radar-keys{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center}
.radar-legend{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--muted)}
.radar-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.radar-note{font-size:11.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.radar-poly{transition:none}}
.ph-bars{margin-top:6px}
.ph-bar{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}
.ph-bar:last-child{border-bottom:0}
.ph-bar__name{flex:1;font-weight:500;display:flex;align-items:center;gap:8px}
.ph-bar__track{width:38%;height:8px;border-radius:4px;background:var(--inset);overflow:hidden;flex:none}
.ph-bar__fill{height:100%;border-radius:4px;transform-origin:left center;background:var(--fill);animation:fillIn .5s cubic-bezier(.2,0,0,1) both}
.ph-bar__val{width:54px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.ph-insight{border:1px solid var(--accent-border);border-radius:16px;padding:22px 24px;background:linear-gradient(180deg,var(--accent-tint),var(--surface) 60%);margin-bottom:16px;position:relative}
.ph-insight__eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ph-insight__title{font-size:17px;font-weight:600;letter-spacing:-0.01em;margin-bottom:6px}
.ph-insight__text{font-size:13.5px;line-height:1.6;color:var(--muted);max-width:760px}
.ph-insight__impact{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px}
.ph-insight__impact-item{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.ph-insight__impact-item .ic{color:var(--warn-strong)}
.ph-insight__act{margin-top:16px}
.ph-sev{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.ph-sev__chip{flex:1;min-width:120px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:12px 14px}
.ph-sev__num{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1;letter-spacing:-0.01em}
.ph-sev__label{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px}
.ph-sev__chip.is-critical{border-color:color-mix(in oklab,var(--danger) 55%,var(--border))}
.ph-sev__chip.is-critical .ph-sev__num{color:var(--danger-strong)}
.ph-sev__chip.is-warning{border-color:color-mix(in oklab,var(--warn) 55%,var(--border))}
.ph-sev__chip.is-warning .ph-sev__num{color:var(--warn-strong)}
.ph-sev__chip.is-monitor{border-color:color-mix(in oklab,var(--info) 55%,var(--border))}
.ph-sev__chip.is-monitor .ph-sev__num{color:var(--info-strong)}
.ph-dot{width:7px;height:7px;border-radius:50%;background:var(--border)}
.ph-sev__chip.is-critical .ph-dot{background:var(--danger)}
.ph-sev__chip.is-warning .ph-dot{background:var(--warn)}
.ph-sev__chip.is-monitor .ph-dot{background:var(--info)}
.ph-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}
.ph-flow__node{display:inline-flex;align-items:center;gap:8px;background:var(--inset);border:1px solid var(--border);border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600}
.ph-flow__node .ic{color:var(--accent)}
.ph-flow__arrow{color:var(--muted)}
.ph-mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ph-mini{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.ph-mini__label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:7px}
.ph-mini__val{font-size:19px;font-weight:600;margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.ph-mini__sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.ph-fefo{border:1px solid var(--accent-border);background:var(--accent-tint);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.ph-fefo__label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.ph-fefo__row{display:flex;align-items:center;gap:14px;font-size:13.5px;flex-wrap:wrap}
.ph-fefo__batch{font-weight:700}
.ph-fefo__meta{color:var(--muted);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
.ph-fefo__meta b{color:var(--fg);font-weight:600}
.ph-standalone{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.ph-standalone__chart{flex:1.4;min-width:260px}
.ph-standalone__legend{flex:1;min-width:220px;display:flex;flex-direction:column;gap:9px}
.ph-supplier{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:12.5px}
.ph-supplier b{font-weight:600}
.ph-supplier__row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.ph-supplier__row:last-child{border-bottom:0}
.ph-supplier__row span:first-child{color:var(--muted)}
.ph-scenario-opt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ph-scenario-opt .ph-chip{height:32px;padding:0 13px;font-size:12px}
.ph-heat{width:100%;border-collapse:collapse;font-size:12.5px}
.ph-heat th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:9px 10px;text-align:center;border-bottom:1px solid var(--border)}
.ph-heat td{padding:10px;text-align:center;border-bottom:1px solid var(--border);font-weight:600}
.ph-heat td:first-child{text-align:left;font-weight:600}
.ph-heat__cell{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;min-width:76px;border-radius:8px;padding:7px 10px}
.ph-heat__cell.is-0{background:var(--success-tint);color:var(--success-strong)}
.ph-heat__cell.is-1{background:var(--warn-tint);color:var(--warn-strong)}
.ph-heat__cell.is-2{background:color-mix(in oklab,var(--danger) 14%,var(--bg));color:var(--danger-strong)}
.ph-heat__cell.is-3{background:var(--danger-tint);color:var(--danger-strong)}
.ph-method{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:16px 20px}
.ph-method summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted)}
.ph-method summary::-webkit-details-marker{display:none}
.ph-method summary::after{content:"▾";color:var(--muted);transition:transform .2s}
.ph-method[open] summary::after{transform:rotate(180deg)}
.ph-method__body{font-size:12.5px;line-height:1.65;color:var(--muted);margin-top:12px;max-width:720px}
.ph-method__body b{color:var(--fg);font-weight:600}
.ph-plan{width:100%;border-collapse:collapse;font-size:13px}
.ph-plan th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:11px 12px;text-align:right;border-bottom:1px solid var(--border);background:var(--inset)}
.ph-plan th:first-child{text-align:left}
.ph-plan td{padding:12px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;font-weight:600}
.ph-plan td:first-child{text-align:left;font-weight:600}
.ph-plan tr.is-total td{border-top:2px solid var(--border);font-weight:700}
.ph-chain{display:flex;flex-direction:column;gap:0;margin-top:4px}
.ph-chain__row{display:flex;align-items:center;gap:12px;padding:9px 0}
.ph-chain__row .ic{color:var(--accent);flex:none}
.ph-chain__row div{flex:1;font-size:13px;font-weight:500}
.ph-chain__row span{font-size:11.5px;color:var(--muted);text-align:right}
.ph-chain__link{text-align:center;color:var(--muted);line-height:1;margin:-2px 0}
.ph-mgr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ph-quick{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;transition:transform .15s,box-shadow .15s}
.ph-quick:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.ph-quick__icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-bottom:8px}
.ph-quick__val{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.ph-quick__label{font-size:11.5px;color:var(--muted)}
.ph-quick__icon.tone-ok{background:var(--success-tint);color:var(--success-strong)}
.ph-quick__icon.tone-warn{background:var(--warn-tint);color:var(--warn-strong)}
.ph-quick__icon.tone-danger{background:var(--danger-tint);color:var(--danger-strong)}
.ph-quick__icon.tone-accent{background:var(--accent-tint);color:var(--accent)}
.ph-audit{position:relative;padding-left:22px;margin-left:7px}
.ph-audit::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--border)}
.ph-audit__item{position:relative;padding:0 0 16px}
.ph-audit__item::before{content:"";position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.ph-audit__date{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.ph-audit__time{font-size:11.5px;color:var(--muted)}
.ph-audit__text{font-size:13px;margin-top:3px}
.ph-temp{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:10px}
.ph-temp__reading{font-family:var(--font-display);font-size:34px;font-weight:400;letter-spacing:-0.01em;line-height:1;font-variant-numeric:tabular-nums}
.ph-temp__range{font-size:12px;color:var(--muted)}
.ph-temp__status{font-size:12.5px;font-weight:600;color:var(--success-strong);display:inline-flex;align-items:center;gap:7px}
.ph-temp__excursion{border:1px solid color-mix(in oklab,var(--warn) 55%,var(--border));background:var(--warn-tint);border-radius:12px;padding:13px 16px;margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ph-kpi-strip{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin-bottom:20px}
@media (max-width:1200px){.ph-kpi-strip{grid-template-columns:repeat(4,1fr)}}
@media (max-width:1120px){
  .ph-hero{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:720px){
  .ph-kpi-strip{grid-template-columns:1fr 1fr;gap:12px}
  .ph-hero{grid-template-columns:1fr 1fr}
  .ph-chart{height:140px}
  .ph-tabs{gap:2px}
  .ph-tab{height:34px;padding:0 10px;font-size:12px}
  .ph-insight{padding:18px 16px}
}

/* ---- Staff & Settings ---- */
.staff-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media (max-width:1200px){.staff-kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:720px){.staff-kpis{grid-template-columns:1fr 1fr;gap:12px}}
.setting-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:0}
.setting-row__body{min-width:0}
.setting-row__label{font-size:13.5px;font-weight:600}
.setting-row__sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.setting-row__ctrl{flex:none;display:flex;align-items:center;gap:10px}
.switch{position:relative;width:44px;height:26px;border-radius:999px;background:var(--inset);border:1px solid var(--border);flex:none;transition:background .18s,border-color .18s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-1);transition:transform .18s cubic-bezier(.2,0,0,1)}
.switch.is-on{background:var(--accent);border-color:var(--accent)}
.switch.is-on::after{transform:translateX(18px)}
.staff-avatar{width:34px;height:34px;border-radius:10px;background:var(--inset);color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.staff-avatar.is-on{background:var(--success-tint);color:var(--success-strong)}
.staff-avatar.is-off{background:var(--warn-tint);color:var(--warn-strong)}
.staff-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.staff-meta__chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:var(--inset);border:1px solid var(--border);border-radius:999px;padding:4px 11px}

@media (max-width:1120px){
  .bedsgrid{grid-template-columns:repeat(3,1fr)}
  .bedmap{grid-template-columns:repeat(4,1fr)}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:920px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .brand__tag{display:none}
  .userbox__name,.userbox__role{display:none}
  .userbox{padding:6px}
}
@media (max-width:720px){
  .sidebar{display:none}
  .bottomnav{display:flex}
  .topbar__search{display:none}
  .topbar__search-mobile{display:grid}
  .topbar{height:56px;padding:0 14px}
  .brand{width:auto}
  .live{display:none}
  .page{padding:22px 16px 92px}
  .kpis{grid-template-columns:1fr 1fr;gap:12px}
  .bedsgrid{grid-template-columns:1fr 1fr}
  .deptgrid{grid-template-columns:1fr}
  .bedmap{grid-template-columns:repeat(3,1fr)}
  .deptrow__bar{width:64px}
  .table{min-width:640px}
  .tablewrap{overflow-x:auto}
  .pagehead__title{font-size:26px}
  .stat__value{font-size:28px}
  .toasts{bottom:74px;right:12px;left:12px;align-items:stretch}
  .toast{max-width:100%}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto!important}
}

</style>

      </button>
      <button class="userbox" id="user-trigger" data-od-id="user-menu" aria-haspopup="true" aria-controls="user-menu" aria-expanded="false">
        <span class="avatar">AA</span>
        <span>
          <span class="userbox__name">Aman Ali</span>
          <span class="userbox__role" id="user-role">Hospital Administrator</span>
        </span>
        <svg class="ic ic--sm" style="color:var(--muted)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar" data-od-id="sidebar">
      <nav class="sidebar__nav" id="nav" aria-label="Primary navigation"></nav>
      <div class="sidebar__foot">
        <button class="sidebar__collapse" id="nav-collapse" aria-label="Collapse navigation">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <span class="sidebar__hint">Ctrl K · search</span>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="page" id="page"></div>
    </main>
  </div>

  <nav class="bottomnav" id="bottomnav" aria-label="Mobile navigation"></nav>
</div>

  <svg class="ic palette__search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>

    <span><span class="kbd">↵</span> open</span>
    <span><span class="kbd">esc</span> close</span>

</div>

function countUp(el,reduce){
 try{
  const txt=(el.textContent||'').trim();
  const m=txt.match(/^([^\d]*)([\d,]+(?:\.\d+)?)(.*)$/);
  if(!m)return;
  const pre=m[1],num=m[2],post=m[3];
  const dec=(num.split('.')[1]||'').length;
  const target=parseFloat(num.replace(/,/g,''));
  const fmt=v=>pre+v.toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec})+post;
  if(reduce){el.textContent=fmt(target);return}
  const dur=650;
  const t0=(window.performance&&window.performance.now&&window.performance.now())||0;
  const step=now=>{
   const p=Math.min(1,((now||t0)-t0)/dur);
   el.textContent=fmt(target*(1-Math.pow(1-p,3)));
   if(p<1)window.requestAnimationFrame(step);
  };
  window.requestAnimationFrame(step);
  setTimeout(()=>{el.textContent=fmt(target)},dur+60);
 }catch(e){}
}

}

function phRadar(){
 const CX=230,CY=196,R=132;
 const occM=Math.max(...DEPTS.map(d=>1-d.avail/d.total));
 const waitM=Math.max(...DEPTS.map(d=>d.wait));
 const urgM=Math.max(...DEPTS.map(d=>d.urgent));
 const patM=Math.max(...DEPTS.map(d=>d.pat));
 const maxs=[occM,waitM,urgM,patM];
 const names=['Occupancy','Avg wait','Urgent','Volume'];
 const toneOf=t=>t==='danger'?'var(--danger)':t==='warn'?'var(--warn)':'var(--success)';
 const pt=(i,f)=>{const a=-Math.PI/2+i*Math.PI/2;return [CX+R*f*Math.cos(a),CY+R*f*Math.sin(a)];};
 const ring=f=>'M'+[0,1,2,3].map(i=>pt(i,f).map(n=>n.toFixed(1)).join(',')).join('L')+'Z';
 const rings=[0.25,0.5,0.75,1].map(f=>'<path d="'+ring(f)+'" fill="none" stroke="var(--border)" stroke-width="1"/>').join('');
 const spokes=[0,1,2,3].map(i=>{const p=pt(i,1);return '<line x1="'+CX+'" y1="'+CY+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>';}).join('');
 const labels=[0,1,2,3].map(i=>{const p=pt(i,1.17);const anch=['middle','start','middle','end'][i];const dy=i===0?-2:i===2?14:4;return '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+dy).toFixed(1)+'" text-anchor="'+anch+'" class="radar-axis">'+names[i]+'</text>';}).join('');
 const polys=DEPTS.map(d=>{
  const vals=[1-d.avail/d.total,d.wait,d.urgent,d.pat];
  const pts=[0,1,2,3].map(i=>pt(i,vals[i]/maxs[i]));
  const p=pts.map(x=>x[0].toFixed(1)+','+x[1].toFixed(1)).join(' ');
  const tone=toneOf(d.tone);
  return '<polygon points="'+p+'" fill="'+tone+'" fill-opacity="0.12" stroke="'+tone+'" stroke-width="1.8" stroke-linejoin="round" class="radar-poly"><title>'+d.name+' · occupancy '+Math.round((1-d.avail/d.total)*100)+'% · wait '+d.wait+' min · urgent '+d.urgent+' · '+d.pat+' patients</title></polygon>';
 }).join('');
 const legend=DEPTS.map(d=>'<span class="radar-legend"><i style="background:'+toneOf(d.tone)+'"></i>'+d.name+'</span>').join('');
 return '<div class="radar">'
  +'<svg viewBox="0 0 460 400" role="img" aria-label="Department load compared across occupancy, average wait, urgent cases and patient volume">'+rings+spokes+labels+polys+'</svg>'
  +'<div class="radar-keys">'+legend+'</div>'
  +'<p class="radar-note">Each axis scaled to its busiest department · closer to the rim means higher load</p></div>';
}

const phRiskBadge=(r)=>r==='HIGH'?'<span class="badge badge--danger">HIGH</span>':r==='MEDIUM'?'<span class="badge badge--warn">MEDIUM</span>':r==='CRITICAL'?'<span class="badge badge--danger">CRITICAL</span>':r==='MONITOR'?'<span class="badge badge--info">MONITOR</span>':'<span class="badge badge--ok">LOW</span>';
const phQualityBadge=(q)=>q==='Verified'?'<span class="badge badge--ok">'+icon('check','ic--sm')+'Verified</span>':q==='Inspection Required'?'<span class="badge badge--warn">'+icon('alert','ic--sm')+'Inspection Required</span>':q==='Temperature Excursion'?'<span class="badge badge--warn">'+icon('thermometer','ic--sm')+'Temp Excursion</span>':q==='Quarantined'?'<span class="badge badge--danger">Quarantined</span>':q==='Recalled'?'<span class="badge badge--danger">Recalled</span>':'<span class="badge badge--neutral">'+q+'</span>';
const phChart=(vals,labels,tone='accent')=>{
 const max=Math.max(...vals,1);
 return '<div class="ph-chart">'+vals.map((v,i)=>'<div class="ph-chart__col"><span class="ph-chart__val">'+Math.round(v).toLocaleString('en-IN')+'</span><div class="ph-chart__bar tone-'+tone+'" style="height:'+Math.round(v/max*100)+'%"></div><span class="ph-chart__label">'+(labels?labels[i]:'')+'</span></div>').join('')+'</div>';
};
const phBarList=(rows,tone)=>{
 const max=Math.max(...rows.map(r=>r[1]));
 return '<div class="ph-bars">'+rows.map(r=>'<div class="ph-bar"><span class="ph-bar__name">'+r[0]+'</span><div class="ph-bar__track"><div class="ph-bar__fill tone-'+tone+'" style="width:'+Math.round(r[1]/max*100)+'%"></div></div><span class="ph-bar__val">'+r[1]+'</span></div>').join('')+'</div>';
};
const phMini=(label,val,sub,iconName='')=>'<div class="ph-mini"><div class="ph-mini__label">'+(iconName?icon(iconName,'ic--sm'):'')+label+'</div><div class="ph-mini__val">'+val+'</div>'+(sub?'<div class="ph-mini__sub">'+sub+'</div>':'')+'</div>';
const phQuick=(iconName,tone,val,label)=>'<div class="ph-quick"><div class="ph-quick__icon tone-'+tone+'">'+icon(iconName)+'</div><div class="ph-quick__val">'+val+'</div><div class="ph-quick__label">'+label+'</div></div>';
const phFlow=(nodes)=>'<div class="ph-flow">'+nodes.map((n,i)=>(i?'<span class="ph-flow__arrow">'+icon('arrow','ic--sm')+'</span>':'')+'<span class="ph-flow__node">'+icon(n[1],'ic--sm')+n[0]+'</span>').join('')+'</div>';
const phTone=(v)=>{if(v<=40)return 'danger';if(v<=65)return 'warn';if(v<=85)return 'info';return 'ok'};

function openPalette(){
 $('#palette').classList.add('is-open');
 $('#overlay').classList.add('is-open');
 $('#palette-input').value='';
 filterPalette('');

 $('#search-trigger').setAttribute('aria-expanded','true');

}
function closePalette(){$('#palette').classList.remove('is-open');$('#overlay').classList.remove('is-open');$('#search-trigger').setAttribute('aria-expanded','false');$('#search-trigger-m').setAttribute('aria-expanded','false')}
function filterPalette(q){
 const ql=q.toLowerCase();
 const res=[];
 SEARCH.forEach(cat=>{
  const hits=cat.items.filter(it=>it.l.toLowerCase().includes(ql)||it.s.toLowerCase().includes(ql));
  if(hits.length){res.push({cat:cat.cat,icon:cat.icon,items:hits})}
 });
 state.sel=0;
 renderPalette(res);
}
function openSearchResult(label,sub){
 const medId={['Paracetamol 500mg']:'pcm',['Amoxicillin 500mg']:'amx',['Azithromycin 500mg']:'azt',['Oral Rehydration Salts']:'ors',['Pantoprazole 40mg']:'ppz'}[label];
 if(medId){state.med=medId;state.phTab='Overview';go('medicine');return}
 const pat=PATIENTS.find(p=>p.n===label);
 if(pat){state.patId=pat.id;go('patient');return}
 const dept=DEPTS.find(d=>d.name===label);
 if(dept){go('departments');return}
 const bed=/^[A-Z]+-\d+/.test(label);
 if(bed){go('beds');state.ward=label.slice(0,label.indexOf('-'));return}
 if(sub&&sub.includes('Doctor')){go('staff');return}
 toast('Opening '+label+'…','info');
}
function renderPalette(res){
 const box=$('#palette-results');
 if(!res.length){box.innerHTML='<div class="palette__empty">No results for “'+$('#palette-input').value+'”</div>';return}
 box.innerHTML=res.map(c=>'<div><div class="palette__cat">'+c.cat+'</div>'+c.items.map(it=>'<button class="palette__item" data-pidx><span class="palette__item__icon">'+icon(c.icon)+'</span><span><div class="palette__label">'+it.l+'</div><div class="palette__sub">'+it.s+'</div></span></button>').join('')+'</div>').join('');
 const items=box.querySelectorAll('.palette__item');
 items.forEach((el,i)=>el.classList.toggle('is-sel',i===state.sel));
 if(items[state.sel]){box.scrollTop=items[state.sel].offsetTop-box.clientHeight/2}
}

 const roles=Object.keys(ROLE_LABELS);
 const menu=$('#user-menu');
 menu.innerHTML='<div class="roleline"><div class="roleline__name">Aman Ali</div><div class="roleline__role" id="menu-role">'+ROLE_LABELS[state.role]+'</div></div>'
  +'<button class="menurow" data-act="profile">'+icon('user')+'Profile</button>'
  +'<button class="menurow" data-act="prefs">'+icon('settings')+'Preferences</button>'
  +'<div class="menu__sep"></div>'
  +'<div class="dropdown__head" style="border-bottom:0;padding:10px 14px 6px"><span class="dropdown__title" style="font-size:12px;text-transform:uppercase;letter-spacing:0.07em">Demo role</span></div>'
  +roles.map(r=>'<button class="menurow is-role" data-act="role" data-role="'+r+'"><span style="display:flex;align-items:center;gap:11px">'+icon(r==='doctor'?'staff':r==='nurse'?'ward':r==='bedmanager'?'beds':r==='receptionist'?'register':'shield')+ROLE_LABELS[r]+'</span>'+(state.role===r?'<span class="menurow__check">'+icon('check','ic--sm')+'</span>':'')+'</button>').join('')

function openNotifMenu(){
 const menu=$('#notif-menu');
 const rows=visibleNotifs().slice(0,5).map(n=>'<div class="notif"><span class="notif__icon" style="background:var(--'+n.sev+'-tint);color:var(--'+n.sev+'-strong)">'+icon(n.sev==='danger'?'alert':n.sev==='warn'?'clock':'info')+'</span><div><div class="notif__text">'+n.t+'</div><div class="notif__time">'+n.time+'</div></div></div>').join('');
 menu.innerHTML='<div class="dropdown__head"><span class="dropdown__title">Notifications</span><button class="dropdown__act" data-act="mark-read">Mark all read</button></div>'
  +'<div class="dropdown__body">'+rows+'<button class="menurow" data-nav="notifications">'+icon('bell','ic--sm')+'View notification center</button></div>';
 positionDropdown(menu,$('#notif-trigger'),true);
 menu.classList.add('is-open');
 $('#overlay').classList.add('is-open');
 $('#notif-trigger').setAttribute('aria-expanded','true');
}
function positionDropdown(menu,anchor,rightAlign){
 const r=anchor.getBoundingClientRect();
 const mw=menu.offsetWidth||parseInt(menu.classList.contains('dropdown--narrow')?'252':'340');
 let left;
 if(rightAlign){left=Math.min(r.right-mw,window.innerWidth-mw-12)}else{left=Math.min(r.left,window.innerWidth-mw-12)}
 left=Math.max(12,left);
 menu.style.left=left+'px';
 menu.style.top=(r.bottom+8)+'px';
}
function closeMenus(){['#user-menu','#notif-menu'].forEach(s=>$(s).classList.remove('is-open'));$('#user-trigger').setAttribute('aria-expanded','false');$('#notif-trigger').setAttribute('aria-expanded','false');if(!$('#palette').classList.contains('is-open'))$('#overlay').classList.remove('is-open')}

function openBedDrawer(bedId,ward,status){
 const st=status||'available';
 CURRENT_BED=bedId;
 const meta={ICU:{fl:3,rm:'302',type:'ICU'},EMERGENCY:{fl:1,rm:'104',type:'Emergency'},GENERAL:{fl:2,rm:'216',type:'General'},PEDIATRICS:{fl:1,rm:'112',type:'Pediatric'}}[ward]||{fl:1,rm:'101',type:'General'};
 const drawer=$('#bed-drawer');
 drawer.innerHTML='<div class="drawer__head"><h2 class="drawer__title">'+bedId+'</h2><button class="iconbtn" data-act="close-drawer">'+icon('x')+'</button></div>'
  +'<div class="drawer__body">'
  +'<div class="drawer__row drawer__field"><div><div class="drawer__label">Status</div><div class="drawer__value">'+bedStatusHTML(st)+'</div></div><span class="avatar'+(st==='available'?' avatar--ok':st==='cleaning'?'':' avatar--danger')+'" style="width:40px;height:40px">'+icon('beds','ic--sm')+'</span></div>'
  +'<div class="drawer__row drawer__field"><div><div class="drawer__label">Department</div><div class="drawer__value">'+ward.replace(/_/g,' ')+'</div></div><div style="text-align:right"><div class="drawer__label">Floor</div><div class="drawer__value">'+meta.fl+'</div></div></div>'
  +'<div class="drawer__row drawer__field"><div><div class="drawer__label">Room</div><div class="drawer__value">'+meta.rm+'</div></div><div style="text-align:right"><div class="drawer__label">Bed type</div><div class="drawer__value">'+meta.type+'</div></div></div>'
  +'<div style="margin-top:8px;background:var(--surface);border-radius:var(--radius);padding:12px 14px;font-size:12.5px;color:var(--muted)">Last updated '+timeAgo()+' · audited by operations</div>'
  +'</div>'
  +'<div class="drawer__actions">'
   +'<button class="btn btn--primary" data-act="assign-bed" '+(st!=='available'?'disabled':'')+'>'+icon('beds','ic--sm')+'Assign patient</button>'
   +'<button class="btn btn--ghost" data-act="reserve-bed" '+(st!=='available'?'disabled':'')+'>Reserve bed</button>'
  +'<button class="btn btn--ghost" data-act="mark-maint">'+icon('settings','ic--sm')+'Mark maintenance</button>'

function closeDrawer(){$('#bed-drawer').classList.remove('is-open');if(!$('#palette').classList.contains('is-open')&&!$('#user-menu').classList.contains('is-open')&&!$('#notif-menu').classList.contains('is-open'))$('#overlay').classList.remove('is-open')}
function openModal(title,text,detail,confirmLabel){
 $('#modal').innerHTML='<div class="modal__card"><h2 class="modal__title">'+icon('alert')+title+'</h2>'
  +'<p class="modal__text">'+text+'</p>'
  +(detail?'<div class="modal__detail">'+detail+'</div>':'')
  +'<div class="modal__actions"><button class="btn btn--ghost" data-act="modal-cancel">Cancel</button><button class="btn btn--primary" data-act="modal-confirm">'+confirmLabel+'</button></div></div>';
 $('#modal').classList.add('is-open');
 $('#overlay').classList.add('is-open');
}
function closeModal(){$('#modal').classList.remove('is-open');if(!$('#palette').classList.contains('is-open')&&!$('#user-menu').classList.contains('is-open')&&!$('#notif-menu').classList.contains('is-open')&&!$('#bed-drawer').classList.contains('is-open'))$('#overlay').classList.remove('is-open')}

const SCREENS=['dashboard','queue','beds','patients','patient','departments','notifications','consult','history','ward','register','admissions','analytics','reports','staff','settings','pharmacy','medicine','expiry','procurement','casemix'];
function go(id){
 if(id==='beds2')id='beds';
 if(!SCREENS.includes(id)){toast('Screen coming in the next build pass','info');return}
 state.screen=id;
 renderScreen();
}
function onNavClick(target){
 const nav=target.closest('[data-nav]');
 if(!nav)return;
 const id=nav.dataset.nav;
 go(id);
 closeMenus();
 if($('#notif-menu').classList.contains('is-open'))$('#notif-menu').classList.remove('is-open');
}
function queueCount(){return DEPTS.reduce((s,d)=>s+d.wait,0)}

document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-nav]');
 if(nav){onNavClick(nav);return}
 const act=e.target.closest('[data-act]');
 if(act){handleAct(act);return}
  const wardChip=e.target.closest('[data-wardmap]');
  if(wardChip){state.ward=wardChip.dataset.wardmap;document.querySelectorAll('[data-wardmap]').forEach(c=>c.classList.toggle('is-active',c===wardChip));renderBedMap();$('#bedmap').closest('.panel').querySelector('.panel__title').innerHTML=icon('beds')+state.ward.replace(/_/g,' ')+' · Bed Map';return}
  const bed=e.target.closest('[data-bed]');
  if(bed){openBedDrawer(bed.dataset.bed,bed.dataset.ward,bed.dataset.status);return}
  const qDept=e.target.closest('.wardchip[data-ward]');
  if(qDept){state.queueDept=parseInt(qDept.dataset.ward,10);renderScreen();return}
   const pItem=e.target.closest('.palette__item');
   if(pItem){const l=pItem.querySelector('.palette__label').textContent;const s=pItem.querySelector('.palette__sub').textContent;closePalette();openSearchResult(l,s);return}
  const notif=e.target.closest('.notif');
  if(notif){closeMenus();return}
  const med=e.target.closest('[data-med]');
  if(med){const id=med.dataset.med;if(id){state.med=id;state.phTab='Overview';go('medicine');return}}
  const ptab=e.target.closest('[data-ptab]');
  if(ptab){state.phTab=ptab.dataset.ptab;renderScreen();return}
  const prange=e.target.closest('[data-prange]');
  if(prange){state.phRange=prange.dataset.prange;renderScreen();return}
  const scenario=e.target.closest('[data-scenario]');
  if(scenario){state.scenario=scenario.dataset.scenario;renderScreen();return}
});
function handleAct(act){
 const a=act.dataset.act;
  if(a==='patfilter'){state.patFilter=act.dataset.filter||'All';renderScreen();return}
  if(a==='clear-patsearch'){state.patSearch='';renderScreen();return}
  if(a==='staff-filter'){state.staffFilter=act.dataset.filter||'All';renderScreen();return}
  if(a==='staff-add')toast('Invitation sent · staff member will be onboarded by HR','success')
  if(a==='staff-profile'){closeMenus();toast('Opening '+act.dataset.staff+' profile…','info')}
  if(a==='set-theme'){state.theme=state.theme==='light'?'dark':'light';store.set('theme',state.theme);document.documentElement.dataset.theme=state.theme;const ti=$('#theme-icon');if(ti){ti.classList.remove('swap');void ti.offsetWidth;ti.classList.add('swap');ti.innerHTML=state.theme==='dark'?I.sun:I.moon}renderScreen();toast(state.theme==='dark'?'Dark mode enabled':'Light mode enabled','info')}
  if(a==='set-collapse'){state.collapsed=!state.collapsed;store.set('collapsed',state.collapsed);renderNav();renderScreen();toast(state.collapsed?'Sidebar collapsed':'Sidebar expanded','info')}
  if(a==='set-notif'){const k=act.dataset.notif;if(!k)return;const label=act.getAttribute('aria-label');state.notifs[k]=!state.notifs[k];store.set('notifs',state.notifs);const on=state.notifs[k];act.classList.toggle('is-on',on);act.setAttribute('aria-checked',on?'true':'false');renderTopbar();if($('#notif-menu').classList.contains('is-open'))openNotifMenu();toast((on?'Enabled':'Disabled')+' '+label,'info')}
 if(a==='mark-read'){state.notifUnread=0;renderTopbar();toast('All notifications marked as read','success')}
  if(a==='call')toast('Patient called to consultation','info')
  if(a==='view'){const id=act.dataset.pat;if(id&&PATIENTS.some(p=>p.id===id)){state.patId=id;closeMenus();go('patient')}else toast('Opening patient profile…','info');return}
 if(a==='assign-bed')openModal('Assign bed to patient','This action will mark the bed as occupied.','<div><div class="drawer__label">Bed</div><div class="drawer__value">'+CURRENT_BED+'</div></div><div><div class="drawer__label">Suggested patient</div><div class="drawer__value">Rahul Sharma · PT-10284</div></div><div><div class="drawer__label">Department</div><div class="drawer__value">'+state.ward.replace(/_/g,' ')+'</div></div><div><div class="drawer__label">Priority</div><div class="drawer__value">CRITICAL</div></div>','Confirm assignment')
  if(a==='modal-confirm'){closeModal();state.bedOv[CURRENT_BED]='occupied';toast('Bed assigned successfully','success');state.notifUnread++;renderTopbar();if($('#bedmap'))renderBedMap();return}
  if(a==='modal-cancel')closeModal()
  if(a==='reserve-bed'){state.bedOv[CURRENT_BED]='reserved';closeDrawer();toast('Bed reserved for incoming patient','success');if($('#bedmap'))renderBedMap();return}
  if(a==='mark-maint'){state.bedOv[CURRENT_BED]='maintenance';closeDrawer();toast('Bed marked for maintenance','warn');if($('#bedmap'))renderBedMap();return}
  if(a==='assign-flow')toast('Assignment workflow · select patient first','info')
  if(a==='soon')toast('This module ships in the next build pass','info')
  if(a==='save-consult')toast('Consultation saved · patient marked Completed','success')
  if(a==='reg-next'){const step=state.regStep||1;state.regStep=step===1?2:3;state.regData=collectReg();renderScreen();return}
  if(a==='reg-back'){state.regStep=Math.max(1,(state.regStep||1)-1);renderScreen();return}
  if(a==='reg-submit'){state.regData=collectReg();toast('Patient registered · queue position #7 · est. 18 min','success');state.regStep=1;state.regData={};go('register');return}
 if(a==='close-drawer')closeDrawer()
 if(a==='close')closeMenus()
  if(a==='profile'){closeMenus();go('settings');return}
  if(a==='prefs'){closeMenus();go('settings');return}
 if(a==='help'){closeMenus();toast('Press Ctrl K for global search','info')}
 if(a==='logout'){closeMenus();toast('Signed out (demo)','info')}
  const role=a==='role'?act.dataset.role:null;
  if(a==='role'&&role){state.role=role;state.screen='dashboard';store.set('role',role);closeMenus();renderScreen();renderNav();toast('Switched to '+ROLE_LABELS[role]+' view','success')}
  if(a==='ph-export')toast('Pharmacy inventory export queued · CSV ready in downloads','success')
  if(a==='ph-batch')toast('Recording new batch receipt…','info')
  if(a==='ph-forecast')toast('Forecast confidence 82% · based on 12 months history, recorded case mix and seasonality','info')
  if(a==='ph-reorder')toast('Reorder recommendation staged for review · PO not placed','warn')
  if(a==='ph-review-temp')toast('Temperature excursion under review by pharmacy QA','info')
  if(a==='ph-recall')toast('Recall workflow opened · affected records flagged for review','info')
  if(a==='rep-export')toast('Report export queued · CSV ready in downloads','success')
}

$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)onNavClick(b)});
$('#bottomnav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)onNavClick(b)});
$('#search-trigger').addEventListener('click',openPalette);
$('#search-trigger-m').addEventListener('click',openPalette);
$('#notif-trigger').addEventListener('click',e=>{e.stopPropagation();if($('#notif-menu').classList.contains('is-open')){closeMenus()}else openNotifMenu()});
$('#user-trigger').addEventListener('click',e=>{e.stopPropagation();if($('#user-menu').classList.contains('is-open')){closeMenus()}else openUserMenu()});
$('#nav-collapse').addEventListener('click',()=>{state.collapsed=!state.collapsed;store.set('collapsed',state.collapsed);renderNav()});
$('#theme-toggle').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';store.set('theme',state.theme);document.documentElement.dataset.theme=state.theme;const ti=$('#theme-icon');ti.classList.remove('swap');void ti.offsetWidth;ti.classList.add('swap');ti.innerHTML=state.theme==='dark'?I.sun:I.moon});
$('#overlay').addEventListener('click',()=>{closeMenus();closePalette();closeDrawer();closeModal()});
$('#palette-input').addEventListener('input',e=>filterPalette(e.target.value));
document.addEventListener('input',e=>{
 const s=e.target.closest('[data-act="patsearch"]');
 if(s){state.patSearch=s.value;const tb=$('#patient-rows');if(tb){tb.innerHTML=patientRowsHTML()}}
});
$('#palette-input').addEventListener('keydown',e=>{
 const items=$('#palette-results').querySelectorAll('.palette__item');
 if(e.key==='ArrowDown'){e.preventDefault();state.sel=Math.min(state.sel+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('is-sel',i===state.sel));}
 if(e.key==='ArrowUp'){e.preventDefault();state.sel=Math.max(state.sel-1,0);items.forEach((el,i)=>el.classList.toggle('is-sel',i===state.sel));}
  if(e.key==='Enter'){const it=items[state.sel];if(it){const l=it.querySelector('.palette__label').textContent;const s=it.querySelector('.palette__sub').textContent;closePalette();openSearchResult(l,s)}}
 if(e.key==='Escape')closePalette();
});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#palette').classList.contains('is-open'))closePalette();else openPalette()}
 if(e.key==='Escape'){closeMenus();closePalette();closeDrawer();closeModal()}
});

const SIM_EVENTS=[
 ['Emergency patient added to queue','warn','danger','queue'],
 ['ICU bed #17 is now available','success','ok','live'],
 ['Admission ADM-20395 awaiting bed assignment','info','warn','queue'],
 ['Patient moved to position #2 · Ankit Verma','info','ok','queue']];
setInterval(()=>{
 const ev=SIM_EVENTS[Math.floor(Math.random()*SIM_EVENTS.length)];
 toast(ev[0],ev[1]);
 if(state.notifs[ev[3]]!==false){state.notifUnread++;NOTIFS.unshift({cat:ev[3],sev:ev[2]==='ok'?'info':ev[2],t:ev[0],time:'just now'});NOTIFS.pop()}
 const d=DEPTS[Math.floor(Math.random()*DEPTS.length)];
 d.wait=Math.max(0,d.wait+(Math.random()>0.5?1:-1));
 updateNavBadges();
},14000);

renderNav();
renderBottomNav();
renderScreen();
renderBedMap();
document.documentElement.dataset.theme=state.theme;
$('#theme-icon').innerHTML=state.theme==='dark'?I.sun:I.moon;
</script>
