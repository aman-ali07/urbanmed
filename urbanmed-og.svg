<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">UrbanMed · Hospital Operations Platform</title>
<desc id="desc">Open-graph hero card for the UrbanMed hospital operations dashboard: cream background, deep indigo accent, KPI stat cards, staffing bar chart and admissions line chart in flat editorial style.</desc>
<rect width="1600" height="900" fill="#faf7f1"/>
<rect x="0" y="0" width="1600" height="900" fill="none" stroke="#e9e2d5" stroke-width="2"/>

<!-- Wordmark -->
<g font-family="'Instrument Serif', Georgia, serif" fill="#191a1f">
  <rect x="80" y="72" width="44" height="44" rx="12" fill="#33409c"/>
  <path d="M95 84c4 0 7 1.6 9.5 5l4.2-6.4h3.4v24h-3.6v-17.2c-2.2 2.9-5 4.6-8.6 4.6-4.7 0-8.4-3.3-8.4-8.3C91.5 86.8 95.2 84 99.9 84z" fill="#ffffff" transform="translate(-2,0)"/>
  <text x="146" y="106" font-size="46">UrbanMed</text>
  <text x="146" y="134" font-family="'Inter', sans-serif" font-size="18" letter-spacing="6" fill="#5e5a52">HOSPITAL OPERATIONS</text>
</g>

<!-- Headline -->
<g font-family="'Instrument Serif', Georgia, serif" fill="#191a1f">
  <text x="80" y="300" font-size="76">Clear operations,</text>
  <text x="80" y="384" font-size="76">calm leadership.</text>
</g>
<g font-family="'Inter', sans-serif" fill="#5e5a52" font-size="26">
  <text x="84" y="452">Every bed, every OR, every patient</text>
  <text x="84" y="492">— live at a glance.</text>
</g>
<rect x="82" y="528" width="240" height="8" rx="4" fill="#33409c"/>

<!-- KPI cards -->
<g font-family="'Inter', sans-serif">
  <rect x="80" y="600" width="330" height="170" rx="18" fill="#ffffff" stroke="#e9e2d5" stroke-width="2"/>
  <text x="112" y="652" font-size="20" fill="#5e5a52">Bed Occupancy</text>
  <text x="112" y="716" font-family="'Instrument Serif', Georgia, serif" font-size="52" fill="#191a1f">82%</text>
  <text x="112" y="750" font-size="18" fill="#0e9d8c">▲ 3% vs yesterday</text>

  <rect x="440" y="600" width="330" height="170" rx="18" fill="#ffffff" stroke="#e9e2d5" stroke-width="2"/>
  <text x="472" y="652" font-size="20" fill="#5e5a52">ER Wait Time</text>
  <text x="472" y="716" font-family="'Instrument Serif', Georgia, serif" font-size="52" fill="#191a1f">14 <tspan font-size="30">min</tspan></text>
  <text x="472" y="750" font-size="18" fill="#0e9d8c">▼ 6 min vs yesterday</text>

  <rect x="800" y="600" width="330" height="170" rx="18" fill="#ffffff" stroke="#e9e2d5" stroke-width="2"/>
  <text x="832" y="652" font-size="20" fill="#5e5a52">OR Utilization</text>
  <text x="832" y="716" font-family="'Instrument Serif', Georgia, serif" font-size="52" fill="#191a1f">76%</text>
  <text x="832" y="750" font-size="18" fill="#c27612">▲ 5% vs yesterday</text>

  <rect x="1160" y="600" width="360" height="170" rx="18" fill="#ffffff" stroke="#e9e2d5" stroke-width="2"/>
  <text x="1192" y="652" font-size="20" fill="#5e5a52">Pending Orders</text>
  <text x="1192" y="716" font-family="'Instrument Serif', Georgia, serif" font-size="52" fill="#191a1f">8</text>
  <text x="1192" y="750" font-size="18" fill="#c27612">2 need review</text>
</g>

</svg>
